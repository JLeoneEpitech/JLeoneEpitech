<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Jonathan Leone — Lead Developer</title>
  <desc id="desc">Software, AI, Architecture. Des idées utiles. Du code pensé pour durer. Des solutions adaptées à votre métier. Building software and AI solutions.</desc>
  <defs><radialGradient id="glow" cx="1" cy="0" r="1"><stop stop-color="#173642"/><stop offset="1" stop-color="#0a141c"/></radialGradient></defs>
  <rect x="1" y="1" width="998" height="428" rx="9" fill="url(#glow)" stroke="#23414a"/>
  <g font-family="'Courier New',monospace">
    <text x="48" y="57" fill="#53d9df" font-size="17" letter-spacing="3">SOFTWARE · AI · ARCHITECTURE</text>
    <text x="48" y="93" fill="#adbecb" font-size="18" letter-spacing="1">JONATHAN LEONE / LEAD DEVELOPER</text>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="600" letter-spacing="-1" fill="#e6edf3">
    <text x="48" y="175">Des idées utiles.</text>
    <text x="48" y="240">Du code pensé pour durer.</text>
    <text x="48" y="305" fill="#53d9df">Des solutions adaptées à votre métier.</text>
  </g>
  <text x="48" y="378" font-family="'Courier New',monospace" font-size="20" fill="#adbecb"><tspan fill="#53d9df">❯ </tspan>Building software &amp; AI solutions.</text>
  <rect x="485" y="359" width="10" height="23" fill="#53d9df"><animate attributeName="opacity" values="1;0;1" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/></rect>
</svg>
